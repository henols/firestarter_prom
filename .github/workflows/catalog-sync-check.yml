# Phase 6 (LCI-02 supplementary): cross-sub-repo authority assertion per RESEARCH §"Authority Assertion". Triggers on catalog edits OR this workflow's own edits.
name: Catalog sync check
on:
  push:
    branches:
    - main
    paths:
    - 'tools/catalog/**'
    - '.github/workflows/catalog-sync-check.yml'
  pull_request:
    branches:
    - main
    paths:
    - 'tools/catalog/**'
    - '.github/workflows/catalog-sync-check.yml'
  workflow_dispatch:

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      # No `submodules: recursive` here: this job reads only
      # `meta/tools/catalog/messages.toml`, and it checks the sub-repos out
      # explicitly below at the ref it actually wants to compare. Fetching them
      # again as submodules was pure duplicate work -- and it re-armed a whole
      # failure class, which is exactly what bit this workflow: an accidentally
      # committed gitlink at `.planning/v1.7/upstream-rurp` with no `.gitmodules`
      # entry made the checkout die with `fatal: No url found for submodule
      # path` before any assertion ran.
      - name: Check out meta-repo
        uses: actions/checkout@v4
        with:
          path: meta

      # Resolve which sub-repo ref to compare against, instead of hardcoding `main`.
      #
      # `ref: main` could never work: `tools/catalog/**` has NEVER existed on
      # either sub-repo's `main` branch -- the vendored catalog landed on `beta`,
      # and `main` lags `beta` by ~224 commits in the firmware repo. The step
      # below used to fail with `cmp: firestarter/tools/catalog/messages.toml:
      # No such file or directory`, and this workflow had never once succeeded
      # (5 runs, 5 failures, 2026-07-11 through 2026-08-18) -- so it has never
      # actually asserted the authority property it exists to assert.
      #
      # The assertion is about LOCKSTEP, and lockstep is per-branch: a
      # firmware-touching milestone changes meta's authoritative catalog and both
      # vendored copies on its own three same-named branches, and they only reach
      # `beta` together at close. So compare against the same branch name as the
      # meta ref under test, falling back to `beta` when the sub-repos have no
      # such branch (e.g. a meta-only docs branch). Meta stays the authority
      # within whichever branch is resolved -- the two assertions below are
      # unchanged.
      - name: Resolve sub-repo ref (same branch name, else beta)
        id: subref
        run: |
          CAND="${{ github.head_ref || github.ref_name }}"
          echo "meta ref under test: $CAND"
          for repo in firestarter firestarter_app; do
            if git ls-remote --exit-code --heads \
                 "https://github.com/henols/$repo.git" "$CAND" >/dev/null 2>&1; then
              RESOLVED="$CAND"
            else
              RESOLVED="beta"
            fi
            echo "${repo}_ref=$RESOLVED" >> "$GITHUB_OUTPUT"
            echo "$repo -> $RESOLVED"
          done

      - name: Check out firestarter (firmware sub-repo)
        uses: actions/checkout@v4
        with:
          repository: henols/firestarter
          path: firestarter
          ref: ${{ steps.subref.outputs.firestarter_ref }}

      - name: Check out firestarter_app (host sub-repo)
        uses: actions/checkout@v4
        with:
          repository: henols/firestarter_app
          path: firestarter_app
          ref: ${{ steps.subref.outputs.firestarter_app_ref }}

      - name: Assert cross-sub-repo vendored catalog identity
        run: |
          cmp firestarter/tools/catalog/messages.toml firestarter_app/tools/catalog/messages.toml
          diff firestarter/tools/catalog/messages.toml firestarter_app/tools/catalog/messages.toml
          echo "OK: vendored messages.toml byte-identical across sub-repos"

      - name: Assert vendored catalog matches meta-repo authoritative copy
        run: |
          cmp meta/tools/catalog/messages.toml firestarter/tools/catalog/messages.toml
          cmp meta/tools/catalog/messages.toml firestarter_app/tools/catalog/messages.toml
          diff meta/tools/catalog/messages.toml firestarter/tools/catalog/messages.toml
          diff meta/tools/catalog/messages.toml firestarter_app/tools/catalog/messages.toml
          echo "OK: meta-repo authority preserved end-to-end"
