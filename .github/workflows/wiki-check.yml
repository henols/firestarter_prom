name: Wiki check
on:
  pull_request:
    branches:
    - beta
    paths:
    - 'wiki/**'
    - 'tools/wiki/**'
    - '.github/workflows/wiki-check.yml'
  workflow_dispatch:

jobs:
  wiki-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Assert wiki source integrity
        run: python3 tools/wiki/wiki.py check

      - name: Run wiki tooling selftest
        run: bash tools/wiki/selftest.sh

  wiki-drift-live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Assert published wiki matches source
        run: python3 tools/wiki/wiki.py publish --require-wiki
